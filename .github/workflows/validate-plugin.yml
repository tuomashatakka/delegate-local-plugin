name: Validate plugin

# The plugin installs straight from git, so there is no package to build — the
# validate job is the entire test surface. It checks the two things that actually
# break a plugin in the field: malformed component frontmatter, and scripts that
# are unparseable or not executable.
#
# The page jobs regenerate public/index.html from readme.md and publish it to
# GitHub Pages, so the site can never drift from the README it is built out of.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shell and Python syntax
        run: |
          bash -n skills/delegate-local/scripts/delegate.sh
          bash -n bin/delegate-local
          python -m py_compile skills/delegate-local/scripts/_events.py
          echo "syntax OK"

      - name: Scripts are executable
        # Git tracks the executable bit, but a bad merge or a Windows checkout can
        # drop it. Everything here runs from these files, so a missing bit ships a
        # broken plugin that only fails at first use.
        #
        # __pycache__ is excluded because the py_compile step above generates it in
        # the workspace: bytecode is never executable, so without this the check
        # fails on a file CI created itself.
        run: |
          missing=$(find skills/delegate-local/scripts bin -type f \
                      ! -path '*/__pycache__/*' ! -perm -u+x -print)
          if [ -n "$missing" ]; then
            echo "::error::not executable:"; echo "$missing"; exit 1
          fi
          echo "all scripts executable"

      - name: JSON manifests parse
        run: |
          python -c "import json;json.load(open('.claude-plugin/plugin.json'))"
          python -c "import json;json.load(open('.claude-plugin/marketplace.json'))"
          echo "manifests OK"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: claude plugin validate
        # The native validator is the authoritative check on manifest schema and on
        # the frontmatter of every skill, agent and command. It is the only step
        # here that needs the network, so it runs last: if it ever proves flaky,
        # the offline steps above still cover the real breakage modes.
        run: |
          npm install -g @anthropic-ai/claude-code
          # `validate .` resolves to the marketplace manifest when one is present,
          # so the plugin manifest and its components need their own invocation.
          claude plugin validate . --strict
          claude plugin validate ./.claude-plugin/plugin.json --strict

  build-page:
    # Only on main: a PR must not rewrite the committed page or publish a site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the page from readme.md
        run: |
          pip install -r scripts/requirements.txt
          python scripts/build_page.py

      - name: Commit the page when it changed
        # The generator is deterministic, so a diff here means readme.md or the
        # manifest actually moved. Pushes made with GITHUB_TOKEN do not trigger
        # workflows, so this cannot loop back into another run.
        run: |
          if git diff --quiet -- public/index.html; then
            echo "page unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Rebuild public/index.html from readme.md"
          git push
          echo "page committed"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-page:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-page
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Pages deployments must not cancel each other mid-flight, so this job opts
    # out of the workflow-level cancel-in-progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
